<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #1e1f22;
    color: #eee;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 10px 16px;
    background: #2b2d31;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  header input {
    background: #1e1f22;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
  }
  #model { width: 160px; }
  #host { flex: 1; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .avatar.user { background: #3b6cf6; }
  .avatar.assistant { background: #444; }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .msg.user { background: #3b6cf6; color: white; }
  .msg.assistant { background: #2b2d31; }
  .typing-dots {
    display: inline-flex;
    gap: 4px;
    padding: 2px 0;
  }
  .typing-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #999;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }
  #inputBar {
    display: flex;
    padding: 12px;
    gap: 8px;
    background: #2b2d31;
  }
  #inputBar textarea {
    flex: 1;
    resize: none;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1e1f22;
    color: #eee;
    padding: 10px;
    font-size: 14px;
    height: 46px;
    font-family: inherit;
  }
  #inputBar button {
    padding: 0 20px;
    border: none;
    border-radius: 8px;
    background: #3b6cf6;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #inputBar button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>
  <input id="host" value="" placeholder="http://localhost:51434">
  <input id="model" value="llama3.2:1b" placeholder="model">
</header>

<div id="messages"></div>

<div id="inputBar">
  <textarea id="input" placeholder="Type a message..."></textarea>
  <button id="send">Send</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const hostEl = document.getElementById('host');
const modelEl = document.getElementById('model');

// default host: same hostname as the page, port 51434
hostEl.value = localStorage.getItem('ollamaHost') || (location.protocol + '//' + location.hostname + ':51434');
modelEl.value = localStorage.getItem('ollamaModel') || 'llama3.2:1b';
hostEl.addEventListener('change', () => localStorage.setItem('ollamaHost', hostEl.value));
modelEl.addEventListener('change', () => localStorage.setItem('ollamaModel', modelEl.value));

let history = [];

function addMessage(role, text) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + role;
  avatar.textContent = role === 'user' ? '🧑' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'msg ' + role;
  bubble.textContent = text;

  if (role === 'user') {
    row.appendChild(bubble);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(bubble);
  }

  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addTypingIndicator() {
  const bubble = addMessage('assistant', '');
  bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  return bubble;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  history.push({ role: 'user', content: text });
  addMessage('user', text);
  const assistantDiv = addTypingIndicator();

  try {
    const res = await fetch(hostEl.value.replace(/\/$/, '') + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: modelEl.value,
        messages: history,
        stream: false
      })
    });

    if (!res.ok) {
      assistantDiv.textContent = 'Error: ' + res.status + ' ' + (await res.text());
      sendBtn.disabled = false;
      return;
    }

    const data = await res.json();
    const full = (data.message && data.message.content) || '';
    assistantDiv.textContent = full;
    messagesEl.scrollTop = messagesEl.scrollHeight;

    history.push({ role: 'assistant', content: full });
  } catch (err) {
    assistantDiv.textContent = 'Connection error: ' + err.message;
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
